# Compile kernel.om with the pinned Omega compiler, run it natively on AArch64 and as
# SPIR-V on PoCL's CPU device, compare every case with reference.py, publish a receipt.
# Runs on a free GitHub-hosted ubuntu-24.04-arm runner. No GPU is used.
name: Omega kernel check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    name: kernel.om on AArch64 + SPIR-V (PoCL CPU)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Ubuntu packages (OpenCL loader, LLVM 18 runtime, spirv-val)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang-18 libllvm18 libllvmspirvlib18.1 ocl-icd-libopencl1 ocl-icd-opencl-dev spirv-tools

      - name: Fetch the pinned Omega compiler and PoCL (sha256-checked)
        run: sh tools/fetch.sh

      - name: Check kernel.om
        run: sh tools/check.sh

      - name: Job summary
        if: always()
        run: |
          if [ -f build/summary.md ]; then cat build/summary.md >> "$GITHUB_STEP_SUMMARY"
          else echo '## Omega kernel check: no summary (setup failed before the check started)' >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omega-kernel-receipt
          path: build/receipt/
          if-no-files-found: warn
